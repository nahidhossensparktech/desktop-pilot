[package]
name = "desktop-pilot"
description = "Desktop Pilot: control your computer with natural language, powered by Claude."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "desktop-pilot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
dp-config.workspace = true
dp-core.workspace = true
dp-llm.workspace = true
dp-platform.workspace = true
dp-voice.workspace = true
eframe.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
dp-platform-windows.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dp-platform-macos.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dp-platform-linux.workspace = true

[dev-dependencies]
# Only for writing the app icon to a PNG to look at (app_icon tests).
image.workspace = true

[lints]
workspace = true
