# cargo-deny configuration: advisories, licenses, bans, sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # "Unmaintained" notices (not vulnerabilities): zvariant and zbus_names were merged
    # into zbus 6. They reach us only on Linux via eframe -> accesskit_unix -> zbus 5,
    # and no upgrade exists yet. Revisit when accesskit/atspi move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; transitive via accesskit (Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; transitive via accesskit (Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; transitive via accesskit (Linux)" },
]

[licenses]
version = 2
# Permissive licenses only. Review before adding anything here, since the product
# license is still undecided (PRD open question 5).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # whisper-rs (voice assistant): public-domain dedication; whisper.cpp itself is MIT.
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    # Mozilla root-certificate data (webpki-root-certs, used by rustls for TLS).
    "CDLA-Permissive-2.0",
    # egui's built-in UI font (epaint_default_fonts). Permits embedding in software.
    # Goes away if we switch to Inter only (DESIGN §4.2).
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are `publish = false` and not checked against the allow list.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls (TRD §2.3); no OpenSSL.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
